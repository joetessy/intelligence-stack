# =============================================================================
# Intelligence Stack
# Services: SearXNG · FlareSolverr · Open WebUI · Faster-Whisper (STT)
#           openedai-speech (TTS) · Dashboard
# Native on host:
#   llama-swap → http://localhost:9292  (llama.cpp GGUF models, OpenAI API,
#                                        hot-swaps on demand, unloads after 5m)
#   MLX-LM     → http://localhost:5001  (MLX models, auto-starts via LaunchAgent)
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Status:  ./status.sh
# Logs:    docker compose logs -f [service]
# MLX log: /tmp/mlx-server.log
#
# UIs:
#   Open WebUI   → http://localhost:3000
#   Dashboard    → http://localhost:3001
#   SearXNG      → http://localhost:8080
#   FlareSolverr → internal only (Docker DNS: flaresolverr:8191, no host port)
# =============================================================================

# Cap json-file logs at 30 MB/service (10m × 3): with 30s healthchecks on an
# always-on stack, unbounded logs permanently grow Docker Desktop's VM disk
# image on macOS (it never shrinks).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  flaresolverr:
    # Pinned by digest so `docker compose up` is deterministic.
    # To upgrade: `docker pull ghcr.io/flaresolverr/flaresolverr:latest`
    # then update the @sha256 here to the new digest.
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    container_name: flaresolverr
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - LOG_LEVEL=warning
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    networks:
      - ai-stack

  playwright:
    # Local build bakes the playwright npm package into the image so container
    # starts never contact npmjs.org (the old `npx -y` command did on EVERY
    # start, and an offline recreation failed the whole compose up). The base
    # image digest pin + matching npm version live in playwright/Dockerfile —
    # bump tag, digest, and npm version together, then:
    #   docker compose build playwright
    build: ./playwright
    container_name: playwright
    restart: unless-stopped
    logging: *default-logging
    command: playwright run-server --port 3000 --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/3000'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ai-stack

  searxng:
    image: searxng/searxng:latest@sha256:02d441bbb647b7be422d21041420115cddadac4644368f67c7c7f407bbe72e22
    container_name: searxng
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_HOST=0.0.0.0
      - SEARXNG_PORT=8080
    depends_on:
      flaresolverr:
        condition: service_healthy
    networks:
      - ai-stack

  faster-whisper:
    # fedirz only publishes -cpu and -cuda; -cpu is correct for Apple Silicon.
    # CTranslate2 inside the image already uses ARM NEON optimizations.
    image: fedirz/faster-whisper-server:latest-cpu@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    container_name: faster-whisper
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      # Persist the ~1.6GB whisper model across container recreations. The
      # image runs as root with no HF_HOME override, so the HF cache lands in
      # /root/.cache/huggingface. Without this, every env edit + `up -d`
      # re-downloads the model on the first STT request.
      - faster-whisper-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    environment:
      # large-v3-turbo: ~6x faster than large-v3 with near-equivalent quality.
      # M4 Max + 48GB unified memory has plenty of headroom; ~1.6GB model.
      # int8_float16: noticeably better transcription quality than int8 with
      # nearly the same throughput on Apple Silicon CPU (CTranslate2 + ARM NEON).
      - WHISPER__MODEL=Systran/faster-whisper-large-v3-turbo
      - WHISPER__COMPUTE_TYPE=int8_float16
      - WHISPER__INFERENCE_DEVICE=cpu
      # Gradio (bundled in the faster-whisper-server image) fetches
      # https://api.gradio.app/gradio-messaging on startup. Kill it.
      - GRADIO_ANALYTICS_ENABLED=False
      - HF_HUB_OFFLINE=0  # model still needs to be pulled on first run; flip to 1 after
    networks:
      - ai-stack

  openedai-speech:
    image: ghcr.io/matatonic/openedai-speech:latest@sha256:3ef4f857d5a757cfe8e9b61185df1bd3c52c45f950716a54e4399c27c3e91396
    container_name: openedai-speech
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8880:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - openedai-speech-voices:/app/voices
      - openedai-speech-config:/app/config
    environment:
      - TTS_HOME=/app/voices
      - HF_HOME=/app/voices
    networks:
      - ai-stack

  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:7f1b0a1a50cfbac23da3b16f96bc968fd757b26dc9e54e93813d61768ea9184e
    container_name: open-webui
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # ── Local LLM backends (OpenAI-compatible) ──────────────────────────
      # Ollama is gone. Chat + embeddings now come from llama-swap (llama.cpp)
      # and MLX, both over the OpenAI API. URLS/KEYS are ';'-separated and
      # paired by index (MLX = index 0, llama-swap = index 1).
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URLS=http://host.docker.internal:5001/v1;http://host.docker.internal:9292/v1
      - OPENAI_API_KEYS=mlx-local;llama-swap-local
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search
      # Tuned for M4 Max + 48GB. With 32K-context MLX models, skip the
      # embed-then-retrieve hop and dump search results straight into context.
      - WEB_SEARCH_RESULT_COUNT=8
      - WEB_SEARCH_CONCURRENT_REQUESTS=8
      - WEB_LOADER_ENGINE=playwright
      - PLAYWRIGHT_WS_URL=ws://playwright:3000/
      - BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=true
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://faster-whisper:8000/v1
      - AUDIO_STT_OPENAI_API_KEY=none
      - AUDIO_STT_MODEL=Systran/faster-whisper-large-v3-turbo
      # WebUI offers a "transcription_model" pick at the user level too; this
      # is the server-side default.
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://openedai-speech:8000/v1
      - AUDIO_TTS_OPENAI_API_KEY=none
      - AUDIO_TTS_MODEL=tts-1
      - AUDIO_TTS_VOICE=nova
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_API_KEYS=true
      # Open WebUI is on :3000, dashboard on :3001. Anything else is suspicious.
      # Quiets the startup "CORS_ALLOW_ORIGIN IS SET TO '*'" warning.
      # IMPORTANT: separator is SEMICOLON, not comma — open-webui splits on ';'.
      # Using ',' silently produces a single invalid origin and blocks WS.
      - CORS_ALLOW_ORIGIN=http://localhost:3000;http://localhost:3001
      # langchain (used by Open WebUI's web loader) warns when this is missing.
      - USER_AGENT=intelligence-stack-open-webui/1.0
      # OFFLINE_MODE blocks every outbound update/version check, on top of the
      # individual analytics opt-outs below. Matches the "no cloud" promise.
      - OFFLINE_MODE=true
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      # Embeddings now served by llama-swap (bge-m3 GGUF, pinned always-on).
      # Open WebUI POSTs to {base}/embeddings, so the base URL MUST end in /v1.
      - RAG_EMBEDDING_ENGINE=openai
      # bge-m3: multilingual, dense+sparse, ~8K context, materially better
      # recall than nomic-embed-text on real RAG workloads.
      - RAG_EMBEDDING_MODEL=bge-m3
      - RAG_OPENAI_API_BASE_URL=http://host.docker.internal:9292/v1
      - RAG_OPENAI_API_KEY=llama-swap-local
      # Tuned for bge-m3 (8K embed context) on M4 Max. Larger chunks preserve
      # more context per retrieval; higher top-k lets the model see more
      # candidates without an expensive reranker round-trip.
      - CHUNK_SIZE=1500
      - CHUNK_OVERLAP=200
      - RAG_TOP_K=6
      - PDF_EXTRACT_IMAGES=true
      # bge-m3 is one of the few embedding models trained for BOTH dense
      # similarity AND sparse (lexical) matching. Hybrid search combines the
      # two — measurably better recall on technical/proper-noun-heavy queries
      # that pure cosine misses. Negligible cost since bge-m3 produces both
      # vectors in a single pass.
      - ENABLE_RAG_HYBRID_SEARCH=true
      # (OpenAI backends are configured above via OPENAI_API_BASE_URLS — the
      # MLX server on :5001 and llama-swap on :9292.)
      - ENABLE_MODEL_FILTER=false
      # false = read config from THIS file on every boot (config-as-code), so
      # edits to the env above always take effect. With =true, Open WebUI bakes
      # these values into its DB on first launch and then IGNORES env changes —
      # which is exactly why the old Ollama settings were "stuck". Chats,
      # knowledge bases, users, API keys and installed plugins persist either
      # way (separate DB tables). Set =true if you'd rather manage connections
      # and RAG from the Admin UI instead of this file.
      - ENABLE_PERSISTENT_CONFIG=false
      # Title + tag + search-query generation default to the chat model. With a
      # 27B chat model and ENABLE_SEARCH_QUERY_GENERATION=true (default), every
      # web search pays a big-model prefill just to rewrite the query. Point
      # TASK_MODEL_EXTERNAL at a small fast model to make these cheap.
      #
      # qwen2.5-coder-1.5b-base (940MB) is pinned always-on in llama-swap (its
      # own group, ttl 0), so title/tag/query generation never evicts the
      # active chat model. The id is the llama-swap model key (hyphens, not the
      # old Ollama "name:tag" form). Bump if you find a small Qwen3 chat variant.
      - TASK_MODEL_EXTERNAL=qwen2.5-coder-1.5b-base
      # Alternative: disable auto-generation entirely if you don't use it.
      # - ENABLE_TITLE_GENERATION=false
      # - ENABLE_TAGS_GENERATION=false
      - "TOOL_SERVER_CONNECTIONS=[{\"url\":\"http://host.docker.internal:8901/mcp\",\"path\":\"/\",\"type\":\"mcp\",\"auth_type\":\"none\",\"headers\":null,\"key\":\"\",\"config\":{\"enable\":true},\"info\":{\"id\":\"mcp-filesystem\",\"name\":\"Filesystem\",\"description\":\"Read & write files in ~/Documents, ~/Projects, ~/Downloads\"}}]"
      - "TERMINAL_SERVER_CONNECTIONS=[{\"id\":\"open-terminal\",\"name\":\"Open Terminal\",\"enabled\":true,\"url\":\"http://open-terminal:8000\",\"path\":\"/openapi.json\",\"key\":\"${OPEN_TERMINAL_API_KEY}\",\"auth_type\":\"bearer\",\"config\":{}}]"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # service_started, not service_healthy: all four are consumed lazily per
    # request over HTTP — a still-starting sidecar is a recoverable per-request
    # error, not a boot failure. Gating on health (120s start_periods, 30s
    # probe granularity) kept :3000 down for the slowest sidecar on every
    # `compose up`. Healthchecks stay for `docker ps` and the dashboard.
    depends_on:
      searxng:
        condition: service_started
      playwright:
        condition: service_started
      faster-whisper:
        condition: service_started
      openedai-speech:
        condition: service_started
    networks:
      - ai-stack

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest@sha256:cf0ad7e309b3202b384560e92782b116e955c9424d6c000efe2fa7ee2608f706
    container_name: open-terminal
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8888:8000"
    healthcheck:
      # $$ escapes the $ so Docker Compose passes it through and the shell
      # inside the container expands OPEN_TERMINAL_API_KEY from its own env.
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: Bearer $$OPEN_TERMINAL_API_KEY\" http://localhost:8000/api/config > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-stack

  dashboard:
    build: ./dashboard
    container_name: dashboard
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      # Use 127.0.0.1 explicitly: Alpine BusyBox wget resolves "localhost" to
      # ::1 first, and Next.js standalone (HOSTNAME=0.0.0.0) only binds IPv4 —
      # the v6 attempt errored "Connection refused" and never fell back.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - OPEN_WEBUI_URL=http://open-webui:8080
      - SEARXNG_URL=http://searxng:8080
      - WHISPER_URL=http://faster-whisper:8000
      - TTS_URL=http://openedai-speech:8000
      - LLAMASWAP_URL=http://host.docker.internal:9292
      - MLX_URL=http://host.docker.internal:5001
      - TOOLS_UI_URL=http://host.docker.internal:5005
      - MCP_FS_URL=http://host.docker.internal:8901
      - OPEN_TERMINAL_URL=http://open-terminal:8000
      - OPEN_TERMINAL_KEY=${OPEN_TERMINAL_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-stack

# =============================================================================
volumes:
  open-webui-data:
  openedai-speech-voices:
  openedai-speech-config:
  faster-whisper-cache:

networks:
  ai-stack:
    driver: bridge
